[project]
name = "verity"
version = "0.5.0"
description = "Søk i egne lyd- og videoopptak, transkribert lokalt av nsb-engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.26", "av>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verity*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S110", "S310"]  # assert i tester; S310: adressen sjekkes i EngineClient

[tool.pytest.ini_options]
testpaths = ["tests"]
